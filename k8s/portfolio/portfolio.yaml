apiVersion: v1
kind: ConfigMap
metadata:
  name: portfolio-puffin-config
  namespace: homelab
data:
  LLM_BASE_URL: "${PORTFOLIO_PUFFIN_LLM_BASE_URL}"
  LLM_MODEL: "${PORTFOLIO_PUFFIN_LLM_MODEL}"
  APP_ENV: "homelab"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-puffin-api
  namespace: homelab
  labels:
    app: portfolio-puffin-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: portfolio-puffin-api
  template:
    metadata:
      labels:
        app: portfolio-puffin-api
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: api
          image: ${PORTFOLIO_PUFFIN_API_IMAGE}
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: portfolio-puffin-config
          volumeMounts:
            - name: portfolio-data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
      volumes:
        - name: portfolio-data
          persistentVolumeClaim:
            claimName: portfolio-puffin-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portfolio-puffin-data
  namespace: homelab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-puffin-api
  namespace: homelab
spec:
  selector:
    app: portfolio-puffin-api
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-puffin-web
  namespace: homelab
  labels:
    app: portfolio-puffin-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolio-puffin-web
  template:
    metadata:
      labels:
        app: portfolio-puffin-web
    spec:
      containers:
        - name: web
          image: ${PORTFOLIO_PUFFIN_WEB_IMAGE}
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: portfolio-puffin-web
  namespace: homelab
spec:
  selector:
    app: portfolio-puffin-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
