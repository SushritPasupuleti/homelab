apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: homelab
  labels:
    app: hermes
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /opt/data

              python -m pip install --no-cache-dir ddgs

              cat > /opt/data/config.yaml <<'EOF'
              model:
                provider: custom
                model: ${UNSLOTH_MODEL}
                base_url: http://unsloth.homelab.svc.cluster.local:8000/v1
                api_key: ${UNSLOTH_API_KEY}

              plugins:
                - web-ddgs

              web:
                backend: searxng
                search_backend: searxng
                extract_backend: firecrawl
                keyless_fallback: false
                provider_tier:
                  searxng: free

              dashboard:
                theme: default
              EOF

              cat > /opt/data/.env <<'EOF'
              OPENAI_API_KEY=ollama
              SEARXNG_URL=http://openserp.homelab.svc.cluster.local:7000
              HERMES_DASHBOARD_BASIC_AUTH_USERNAME=admin
              HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=change-me
              HERMES_DASHBOARD_BASIC_AUTH_SECRET=replace-me-with-a-long-random-secret
              EOF

              export HERMES_HOME=/opt/data
              hermes gateway --host 0.0.0.0 --port 8642 --no-open &
              exec hermes dashboard --host 0.0.0.0 --port 9119 --no-open
          ports:
            - containerPort: 8642
              name: api
            - containerPort: 9119
              name: dashboard
          env:
            - name: HERMES_HOME
              value: /opt/data
          volumeMounts:
            - name: hermes-data
              mountPath: /opt/data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
      volumes:
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: homelab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: homelab
  labels:
    app: hermes
spec:
  selector:
    app: hermes
  ports:
    - name: api
      port: 8642
      targetPort: 8642
      protocol: TCP
    - name: dashboard
      port: 9119
      targetPort: 9119
      protocol: TCP
