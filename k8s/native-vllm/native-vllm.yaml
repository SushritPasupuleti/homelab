apiVersion: v1
kind: Service
metadata:
  name: native-vllm
  namespace: homelab
  labels:
    app: native-vllm
spec:
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: native-vllm
  namespace: homelab
  labels:
    app: native-vllm
subsets:
  - addresses:
      - ip: ${NATIVE_VLLM_HOST_IP}
    ports:
      - name: http
        port: 8000
        protocol: TCP
