apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-dashboard-config
  namespace: homelab
data:
  glance.yml: |
    theme:
      background-color: 240 10 17
      primary-color: 267 84 78
      positive-color: 115 54 76
      negative-color: 347 88 70
      contrast-multiplier: 1.12
      text-saturation-multiplier: 1.1
      disable-picker: true

    pages:
      - name: Overview
        head-widgets:
          - type: calendar
            title: Calendar

        columns:
          - size: small
            widgets:
              - type: clock
                title: Local time
                hour-format: 24h

              - type: server-stats
                title: System performance
                cache: 20s
                servers:
                  - type: local
                    name: Homelab host
                    hide-swap: false
                    mountpoints:
                      "/":
                        name: Root
                      "/var/lib/docker":
                        name: Docker
                      "/var/lib/rancher/k3s":
                        name: k3s

              - type: monitor
                title: Service health
                style: compact
                cache: 30s
                sites:
                  - title: Dashboard
                    url: http://dashboard.homelab.home.arpa
                  - title: Project README
                    url: https://github.com/SushritPasupuleti/homelab/blob/main/README.md
                  - title: Stock-EZ
                    url: http://stock-ez.homelab.home.arpa
                  - title: Portainer
                    url: http://portainer.homelab.home.arpa
                  - title: Grafana
                    url: http://grafana.homelab.home.arpa
                  - title: Prometheus
                    url: http://prometheus.homelab.home.arpa
                  - title: Unsloth API
                    url: http://unsloth.homelab.home.arpa
                  - title: Unsloth Studio
                    url: http://unsloth-studio.homelab.home.arpa
                  - title: Open WebUI
                    url: http://open-webui.homelab.home.arpa
                  - title: Hermes
                    url: http://hermes.homelab.home.arpa
                  - title: Hermes Dashboard
                    url: http://hermes-dashboard.homelab.home.arpa
                  - title: Home Assistant
                    url: http://homeassistant.homelab.home.arpa
                  - title: Jellyfin
                    url: http://media.homelab.home.arpa
                  - title: Plex
                    url: http://plex.homelab.home.arpa
                  - title: qBittorrent
                    url: http://torrent.homelab.home.arpa
                  - title: File Browser
                    url: http://files.homelab.home.arpa

              - type: bookmarks
                title: Core services
                groups:
                  - title: Infrastructure
                    links:
                      - title: Dashboard
                        url: http://dashboard.homelab.home.arpa
                      - title: Project README
                        url: https://github.com/SushritPasupuleti/homelab/blob/main/README.md
                      - title: Portainer
                        url: http://portainer.homelab.home.arpa
                      - title: Grafana
                        url: http://grafana.homelab.home.arpa
                      - title: Prometheus
                        url: http://prometheus.homelab.home.arpa
                  - title: Apps
                    links:
                      - title: Stock-EZ
                        url: http://stock-ez.homelab.home.arpa
                      - title: Home Assistant
                        url: http://homeassistant.homelab.home.arpa
                      - title: Open WebUI
                        url: http://open-webui.homelab.home.arpa
                      - title: OpenSERP
                        url: http://openserp.homelab.home.arpa/docs
                      - title: Hermes
                        url: http://hermes.homelab.home.arpa
                      - title: Hermes Dashboard
                        url: http://hermes-dashboard.homelab.home.arpa
                      - title: Unsloth API
                        url: http://unsloth.homelab.home.arpa
                      - title: Unsloth Studio
                        url: http://unsloth-studio.homelab.home.arpa

          - size: full
            widgets:
              - type: split-column
                widgets:
                  - type: custom-api
                    title: Cluster pods
                    cache: 30s
                    url: http://prometheus:9090/api/v1/query?query=count%28kube_pod_info%7Bnamespace%3D%22homelab%22%7D%29%20or%20vector%280%29
                    template: |
                      {{ $value := .JSON.Float "data.result.0.value.1" }}
                      <div class="size-h1 color-primary">{{ printf "%.0f" $value }}</div>
                      <div class="color-subtle">pods</div>

                  - type: custom-api
                    title: CPU use
                    cache: 30s
                    url: http://prometheus:9090/api/v1/query?query=100%20*%20(1%20-%20avg(rate(node_cpu_seconds_total%7Bmode%3D%22idle%22%7D%5B5m%5D)))%20or%20vector%280%29
                    template: |
                      {{ $value := .JSON.Float "data.result.0.value.1" }}
                      <div class="size-h1 color-primary">{{ printf "%.0f" $value }}%</div>
                      <div class="color-subtle">CPU</div>

              - type: split-column
                widgets:
                  - type: custom-api
                    title: Memory use
                    cache: 30s
                    url: http://prometheus:9090/api/v1/query?query=100%20*%20(1%20-%20(node_memory_MemAvailable_bytes%20/%20node_memory_MemTotal_bytes))%20or%20vector%280%29
                    template: |
                      {{ $value := .JSON.Float "data.result.0.value.1" }}
                      <div class="size-h1 color-primary">{{ printf "%.0f" $value }}%</div>
                      <div class="color-subtle">RAM</div>

                  - type: custom-api
                    title: Network throughput
                    cache: 30s
                    url: http://prometheus:9090/api/v1/query?query=sum(rate(node_network_receive_bytes_total%5B5m%5D))%20%2B%20sum(rate(node_network_transmit_bytes_total%5B5m%5D))%20or%20vector%280%29
                    template: |
                      {{ $value := .JSON.Float "data.result.0.value.1" }}
                      <div class="size-h1 color-primary">{{ printf "%.0f" $value }}</div>
                      <div class="color-subtle">B/s</div>

              - type: split-column
                widgets:
                  - type: custom-api
                    title: K3s nodes
                    cache: 30s
                    url: http://prometheus:9090/api/v1/query?query=count(kube_node_status_condition%7Bcondition%3D%22Ready%22%2Cstatus%3D%22true%22%7D)%20or%20vector%280%29
                    template: |
                      {{ $value := .JSON.Float "data.result.0.value.1" }}
                      <div class="size-h1 color-primary">{{ printf "%.0f" $value }}</div>
                      <div class="color-subtle">nodes ready</div>

                  - type: custom-api
                    title: Root disk use
                    cache: 30s
                    url: http://prometheus:9090/api/v1/query?query=100%20*%20(1%20-%20avg(node_filesystem_avail_bytes%7Bmountpoint%3D%22%2F%22%7D%20/%20node_filesystem_size_bytes%7Bmountpoint%3D%22%2F%22%7D))%20or%20vector%280%29
                    template: |
                      {{ $value := .JSON.Float "data.result.0.value.1" }}
                      <div class="size-h1 color-primary">{{ printf "%.0f" $value }}%</div>
                      <div class="color-subtle">disk used</div>

              - type: monitor
                title: Home services
                style: compact
                cache: 30s
                sites:
                  - title: Home Assistant
                    url: http://homeassistant.homelab.home.arpa
                  - title: Open WebUI
                    url: http://open-webui.homelab.home.arpa
                  - title: Unsloth API
                    url: http://unsloth.homelab.home.arpa
                  - title: Unsloth Studio
                    url: http://unsloth-studio.homelab.home.arpa
                  - title: OpenSERP
                    url: http://openserp.homelab.home.arpa/docs
                  - title: Hermes Dashboard
                    url: http://hermes-dashboard.homelab.home.arpa
                  - title: Jellyfin
                    url: http://media.homelab.home.arpa
                  - title: Plex
                    url: http://plex.homelab.home.arpa
                  - title: qBittorrent
                    url: http://torrent.homelab.home.arpa
                  - title: File Browser
                    url: http://files.homelab.home.arpa

              - type: bookmarks
                title: Media and downloads
                groups:
                  - title: Media
                    links:
                      - title: Jellyfin
                        url: http://media.homelab.home.arpa
                      - title: Plex
                        url: http://plex.homelab.home.arpa
                  - title: Downloads
                    links:
                      - title: qBittorrent
                        url: http://torrent.homelab.home.arpa
                      - title: File Browser
                        url: http://files.homelab.home.arpa
                  - title: LAN access
                    links:
                      - title: Stock-EZ (IP)
                        url: http://192.168.0.6
                      - title: Portainer (IP)
                        url: http://192.168.0.6:30900
                      - title: Home Assistant (IP)
                        url: http://192.168.0.6:8123
                      - title: Open WebUI (IP)
                        url: http://192.168.0.6
                      - title: Grafana (IP)
                        url: http://192.168.0.6:3000
                      - title: Unsloth Studio (IP)
                        url: http://192.168.0.6

      - name: Monitoring
        columns:
          - size: small
            widgets:
              - type: monitor
                title: Monitoring endpoints
                style: compact
                cache: 30s
                sites:
                  - title: Grafana
                    url: http://grafana.homelab.home.arpa
                  - title: Prometheus
                    url: http://prometheus.homelab.home.arpa
                  - title: Portainer
                    url: http://portainer.homelab.home.arpa
                  - title: Open WebUI
                    url: http://open-webui.homelab.home.arpa

              - type: bookmarks
                title: Monitoring quick links
                groups:
                  - title: Dashboards
                    links:
                      - title: Grafana
                        url: http://grafana.homelab.home.arpa
                      - title: Prometheus
                        url: http://prometheus.homelab.home.arpa
                      - title: OpenSERP
                        url: http://openserp.homelab.home.arpa/docs
                      - title: Dashboard
                        url: http://dashboard.homelab.home.arpa

          - size: full
            widgets:
              - type: iframe
                title: Homelab dashboard
                source: http://grafana.homelab.home.arpa/d/home/homelab-overview?orgId=1&theme=dark&kiosk
                height: 860

              - type: custom-api
                title: Prometheus target health
                cache: 30s
                url: http://prometheus:9090/api/v1/query?query=up%7Bjob%3D~%22.%2B%22%7D%20or%20vector%280%29
                template: |
                  {{ $value := .JSON.Float "data.result.0.value.1" }}
                  <div class="size-h1 color-primary">{{ printf "%.0f" $value }}</div>
                  <div class="color-subtle">targets up</div>

