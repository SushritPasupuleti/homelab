      - name: Unsloth
        columns:
          - size: small
            widgets:
              - type: custom-api
                title: Service mode
                cache: 30s
                url: http://prometheus:9090/api/v1/query?query=kube_deployment_spec_replicas%7Bdeployment%3D%22unsloth%22%7D%20or%20vector%280%29
                template: |
                  {{ $replicas := .JSON.Float "data.result.0.value.1" }}
                  {{ if eq (printf "%.0f" $replicas) "0" }}
                    <div class="size-h1 color-primary">Disabled</div>
                    <div class="color-subtle">execution mode</div>
                    <div class="margin-top-5 color-subtle">Compute allocation: ${UNSLOTH_COMPUTE_MODE} · Unsloth has been scaled down and is currently disabled.</div>
                  {{ else }}
                    <div class="size-h1 color-primary">API ready</div>
                    <div class="color-subtle">execution mode</div>
                    <div class="margin-top-5 color-subtle">Compute allocation: ${UNSLOTH_COMPUTE_MODE} · The service is online and responding in OpenAI-compatible mode.</div>
                  {{ end }}

              - type: custom-api
                title: Available models
                cache: 15s
                url: http://unsloth:8000/v1/models
                template: |
                  {{ $models := .JSON.Array "data" }}
                  {{ if eq (len $models) 0 }}
                    <p class="color-subtle">No models are currently exposed by the Unsloth API.</p>
                  {{ else }}
                    {{ range $model := $models }}
                      {{ $id := $model.Get "id" }}
                      {{ $ownedBy := $model.Get "owned_by" }}
                      <div class="list-item margin-bottom-8">
                        <div><strong>{{ $id.String }}</strong></div>
                        <div class="color-subtle">
                          {{ if $ownedBy.String }}Provider: {{ $ownedBy.String }}{{ end }}
                        </div>
                      </div>
                    {{ end }}
                  {{ end }}

              - type: monitor
                title: Unsloth endpoints
                style: compact
                cache: 30s
                sites:
                  - title: Unsloth API
                    url: http://unsloth.homelab.home.arpa
                  - title: Open WebUI
                    url: http://open-webui.homelab.home.arpa
                  - title: Hermes
                    url: http://hermes.homelab.home.arpa

              - type: bookmarks
                title: Unsloth access
                groups:
                  - title: Links
                    links:
                      - title: Unsloth API
                        url: http://unsloth.homelab.home.arpa
                      - title: Open WebUI
                        url: http://open-webui.homelab.home.arpa
                      - title: Model list
                        url: http://unsloth.homelab.home.arpa/v1/models

          - size: full
            widgets:
              - type: custom-api
                title: Model inventory
                cache: 60s
                url: http://unsloth:8000/v1/models
                template: |
                  {{ $models := .JSON.Array "data" }}
                  {{ if eq (len $models) 0 }}
                    <p class="color-subtle">No model inventory is available yet.</p>
                  {{ else }}
                    {{ range $model := $models }}
                      {{ $id := $model.Get "id" }}
                      {{ $ownedBy := $model.Get "owned_by" }}
                      <div class="list-item margin-bottom-8">
                        <div><strong>{{ $id.String }}</strong></div>
                        <div class="color-subtle">
                          {{ if $ownedBy.String }}Owned by {{ $ownedBy.String }}{{ else }}OpenAI-compatible endpoint{{ end }}
                        </div>
                      </div>
                    {{ end }}
                  {{ end }}

              - type: custom-api
                title: API status
                cache: 30s
                url: http://prometheus:9090/api/v1/query?query=kube_deployment_spec_replicas%7Bdeployment%3D%22unsloth%22%7D%20or%20vector%280%29
                template: |
                  {{ $replicas := .JSON.Float "data.result.0.value.1" }}
                  {{ if eq (printf "%.0f" $replicas) "0" }}
                    <div class="color-subtle">Status</div>
                    <div class="size-h1 color-primary">Off</div>
                    <div class="margin-top-6 color-subtle">Unsloth has been disabled and is not serving requests.</div>
                  {{ else }}
                    <div class="color-subtle">Status</div>
                    <div class="size-h1 color-primary">On</div>
                    <div class="margin-top-6 color-subtle">The Unsloth deployment is running and ready for requests.</div>
                  {{ end }}

      - name: Tools
        columns:
          - size: small
            widgets:
              - type: bookmarks
                title: External tools
                groups:
