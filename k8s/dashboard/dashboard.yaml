apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-dashboard
  namespace: homelab
  labels:
    app: homelab-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homelab-dashboard
  template:
    metadata:
      labels:
        app: homelab-dashboard
    spec:
      containers:
        - name: homelab-dashboard
          image: glanceapp/glance:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: OLLAMA_BACKEND_MODE
              value: "cpu"
          volumeMounts:
            - name: dashboard-config
              mountPath: /app/config
            - name: docker-sock
              mountPath: /var/run/docker.sock
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: dashboard-config
          configMap:
            name: homelab-dashboard-config
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-dashboard
  namespace: homelab
  labels:
    app: homelab-dashboard
spec:
  type: LoadBalancer
  selector:
    app: homelab-dashboard
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
