apiVersion: v1
kind: ConfigMap
metadata:
  name: homelab-dashboard-config
  namespace: homelab
data:
  glance.yml: |
    theme:
      background-color: 240 9 12
      primary-color: 214 90 55
      positive-color: 150 70 55
      negative-color: 0 75 60
      contrast-multiplier: 1.1

    pages:
      - name: Overview
        columns:
          - size: small
            widgets:
              - type: clock
                title: Local Time
                hour-format: 24h

              - type: monitor
                title: Service connectivity
                style: compact
                cache: 30s
                sites:
                  - title: Dashboard
                    url: http://dashboard.homelab.home.arpa
                    icon: si:glance
                  - title: Stock-EZ
                    url: http://stock-ez.homelab.home.arpa
                    icon: si:streamlit
                  - title: Portainer
                    url: http://portainer.homelab.home.arpa
                    icon: si:docker
                  - title: Home Assistant
                    url: http://homeassistant.homelab.home.arpa
                    icon: si:homeassistant
                  - title: Open WebUI
                    url: http://open-webui.homelab.home.arpa
                    icon: si:openai
                  - title: Grafana
                    url: http://grafana.homelab.home.arpa
                    icon: si:grafana
                  - title: Prometheus
                    url: http://prometheus.homelab.home.arpa
                    icon: si:prometheus
                  - title: Ollama (${OLLAMA_BACKEND_MODE})
                    url: http://ollama.homelab.home.arpa:11434
                    icon: si:ollama
                  - title: qBittorrent
                    url: http://torrent.homelab.home.arpa
                    icon: si:qbittorrent
                  - title: File Browser
                    url: http://files.homelab.home.arpa
                    icon: si:folder

              - type: bookmarks
                title: Fast access
                groups:
                  - title: Critical apps
                    links:
                      - title: Stock-EZ
                        url: http://stock-ez.homelab.home.arpa
                        icon: si:streamlit
                      - title: Portainer
                        url: http://portainer.homelab.home.arpa
                        icon: si:docker
                      - title: Grafana
                        url: http://grafana.homelab.home.arpa
                        icon: si:grafana
                      - title: Ollama
                        url: http://ollama.homelab.home.arpa:11434
                        icon: si:ollama

          - size: full
            widgets:
              - type: server-stats
                title: System Performance
                cache: 20s
                servers:
                  - type: local
                    name: Homelab Node
                    hide-swap: false
                    mountpoints:
                      "/":
                        name: Root
                      "/var/lib/docker":
                        name: Docker Storage
                      "/var/lib/rancher/k3s":
                        name: k3s Storage

              - type: monitor
                title: Cluster pods & services
                style: compact
                cache: 30s
                sites:
                  - title: Ingress
                    url: http://dashboard.homelab.home.arpa
                    icon: si:nginx
                  - title: Prometheus
                    url: http://prometheus.homelab.home.arpa
                    icon: si:prometheus
                  - title: Grafana
                    url: http://grafana.homelab.home.arpa
                    icon: si:grafana
                  - title: Portainer
                    url: http://portainer.homelab.home.arpa
                    icon: si:docker
                  - title: Home Assistant
                    url: http://homeassistant.homelab.home.arpa
                    icon: si:homeassistant
                  - title: Jellyfin
                    url: http://media.homelab.home.arpa
                    icon: si:jellyfin
                  - title: Plex
                    url: http://plex.homelab.home.arpa
                    icon: si:plex
                  - title: qBittorrent
                    url: http://torrent.homelab.home.arpa
                    icon: si:qbittorrent
                  - title: File Browser
                    url: http://files.homelab.home.arpa
                    icon: si:folder
                  - title: Open WebUI
                    url: http://open-webui.homelab.home.arpa
                    icon: si:openai

              - type: split-column
                widgets:
                  - type: iframe
                    title: Grafana Overview
                    source: http://grafana.homelab.home.arpa/d-solo/home/home?orgId=1&panelId=1&theme=dark&refresh=30s
                    height: 340
                  - type: iframe
                    title: Node health
                    source: http://grafana.homelab.home.arpa/d-solo/home/home?orgId=1&panelId=2&theme=dark&refresh=30s
                    height: 340

              - type: split-column
                widgets:
                  - type: iframe
                    title: CPU + Memory
                    source: http://grafana.homelab.home.arpa/d-solo/home/home?orgId=1&panelId=3&theme=dark&refresh=30s
                    height: 300
                  - type: iframe
                    title: Network + traffic
                    source: http://grafana.homelab.home.arpa/d-solo/home/home?orgId=1&panelId=4&theme=dark&refresh=30s
                    height: 300

              - type: bookmarks
                title: Homelab Links
                groups:
                  - title: Core Services
                    links:
                      - title: Stock-EZ
                        url: http://stock-ez.homelab.home.arpa
                        icon: si:streamlit
                      - title: Portainer
                        url: http://portainer.homelab.home.arpa
                        icon: si:docker
                      - title: Home Assistant
                        url: http://homeassistant.homelab.home.arpa
                        icon: si:homeassistant
                      - title: Open WebUI
                        url: http://open-webui.homelab.home.arpa
                        icon: si:openai
                      - title: Grafana
                        url: http://grafana.homelab.home.arpa
                        icon: si:grafana
                      - title: Prometheus
                        url: http://prometheus.homelab.home.arpa
                        icon: si:prometheus
                      - title: qBittorrent
                        url: http://torrent.homelab.home.arpa
                        icon: si:qbittorrent
                      - title: File Browser
                        url: http://files.homelab.home.arpa
                        icon: si:folder
                      - title: Ollama (${OLLAMA_BACKEND_MODE})
                        url: http://ollama.homelab.home.arpa:11434
                        icon: si:ollama
                  - title: Media
                    links:
                      - title: Jellyfin
                        url: http://media.homelab.home.arpa
                        icon: si:jellyfin
                      - title: Plex
                        url: http://plex.homelab.home.arpa
                        icon: si:plex
                  - title: LAN Access
                    links:
                      - title: Stock-EZ (IP)
                        url: http://192.168.1.201
                        icon: si:streamlit
                      - title: Portainer (IP)
                        url: http://192.168.1.6:30900
                        icon: si:docker
                      - title: Home Assistant (IP)
                        url: http://192.168.1.202:8123
                        icon: si:homeassistant
                      - title: Open WebUI (IP)
                        url: http://192.168.1.209
                        icon: si:openai
                      - title: Grafana (IP)
                        url: http://192.168.1.210:3000
                        icon: si:grafana
                      - title: Ollama (IP)
                        url: http://192.168.1.207:11434
                        icon: si:ollama

      - name: Ollama
        columns:
          - size: small
            widgets:
              - type: custom-api
                title: Ollama version
                cache: 1m
                url: http://ollama.homelab.home.arpa:11434/api/version
                template: |
                  <div class="size-h1 color-primary">{{ .JSON.String "version" }}</div>
                  <div class="color-subtle">Local API build</div>
                  <div class="margin-top-10">
                    <a href="http://ollama.homelab.home.arpa:11434" target="_blank" rel="noreferrer">Open API</a>
                  </div>

              - type: custom-api
                title: Loaded models
                cache: 15s
                url: http://ollama.homelab.home.arpa:11434/api/ps
                template: |
                  {{ $models := .JSON.Array "models" }}
                  {{ if eq (len $models) 0 }}
                    <p class="color-subtle">No models are currently loaded.</p>
                  {{ else }}
                    {{ range $idx, $model := $models }}
                      {{ if lt $idx 6 }}
                        <div class="list-item margin-bottom-5">
                          <div><strong>{{ $model.name }}</strong></div>
                          {{ if $model.details }}
                            <div class="color-subtle">
                              {{ if $model.details.parameter_size }}{{ $model.details.parameter_size }} · {{ end }}
                              {{ if $model.details.quantization_level }}{{ $model.details.quantization_level }}{{ end }}
                            </div>
                          {{ end }}
                        </div>
                      {{ end }}
                    {{ end }}
                  {{ end }}

              - type: monitor
                title: Ollama endpoints
                style: compact
                cache: 30s
                sites:
                  - title: Ollama API
                    url: http://ollama.homelab.home.arpa:11434
                    icon: si:ollama
                  - title: Open WebUI
                    url: http://open-webui.homelab.home.arpa
                    icon: si:openai
                  - title: Grafana
                    url: http://grafana.homelab.home.arpa
                    icon: si:grafana

          - size: full
            widgets:
              - type: custom-api
                title: Installed models
                cache: 5m
                url: http://ollama.homelab.home.arpa:11434/api/tags
                template: |
                  {{ $models := .JSON.Array "models" }}
                  <div class="color-subtle">Local inventory: {{ len $models }} models</div>
                  <div class="margin-top-10">
                    {{ range $model := $models }}
                      <div class="list-item margin-bottom-8">
                        <div><strong>{{ $model.name }}</strong></div>
                        <div class="color-subtle">
                          {{ if $model.details }}
                            {{ if $model.details.family }}{{ $model.details.family }} · {{ end }}
                            {{ if $model.details.parameter_size }}{{ $model.details.parameter_size }} · {{ end }}
                            {{ if $model.details.quantization_level }}{{ $model.details.quantization_level }}{{ end }}
                          {{ end }}
                        </div>
                        <div class="color-subtle">Size: {{ $model.size }} bytes</div>
                      </div>
                    {{ end }}
                  </div>

              - type: custom-api
                title: Model metadata
                cache: 5m
                url: http://ollama.homelab.home.arpa:11434/api/show
                body-type: json
                body:
                  model: llama3.2
                template: |
                  {{ $details := .JSON.Get "details" }}
                  {{ if not $details }}
                    <p class="color-subtle">No model metadata returned by the API.</p>
                  {{ else }}
                    <div class="color-subtle">Default model metadata</div>
                    <div class="margin-top-10">
                      <div><strong>Family:</strong> {{ $details.String "family" }}</div>
                      <div><strong>Parameters:</strong> {{ $details.String "parameter_size" }}</div>
                      <div><strong>Format:</strong> {{ $details.String "format" }}</div>
                      <div><strong>Quantization:</strong> {{ $details.String "quantization_level" }}</div>
                    </div>
                  {{ end }}

              - type: bookmarks
                title: Ollama quick links
                groups:
                  - title: Access
                    links:
                      - title: Ollama API
                        url: http://ollama.homelab.home.arpa:11434
                        icon: si:ollama
                      - title: Open WebUI
                        url: http://open-webui.homelab.home.arpa
                        icon: si:openai
                      - title: Grafana
                        url: http://grafana.homelab.home.arpa
                        icon: si:grafana

      - name: Tools
        columns:
          - size: small
            widgets:
              - type: bookmarks
                title: Quick Links
                groups:
                  - title: External
                    links:
                      - title: GitHub
                        url: https://github.com
                        icon: si:github
                      - title: VS Code
                        url: https://code.visualstudio.com
                        icon: si:visualstudiocode
                      - title: Docker Docs
                        url: https://docs.docker.com
                        icon: si:docker
                      - title: NixOS Manual
                        url: https://nixos.org/manual
                        icon: si:nixos
          - size: full
            widgets:
              - type: bookmarks
                title: Admin Tools
                groups:
                  - title: Internal
                    links:
                      - title: Dashboard
                        url: http://dashboard.homelab.home.arpa
                        icon: si:glance
                      - title: Portainer
                        url: http://portainer.homelab.home.arpa
                        icon: si:docker
                      - title: Open WebUI
                        url: http://open-webui.homelab.home.arpa
                        icon: si:openai
                      - title: Home Assistant
                        url: http://homeassistant.homelab.home.arpa
                        icon: si:homeassistant
                      - title: Grafana
                        url: http://grafana.homelab.home.arpa
                        icon: si:grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homelab-dashboard
  namespace: homelab
  labels:
    app: homelab-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homelab-dashboard
  template:
    metadata:
      labels:
        app: homelab-dashboard
    spec:
      containers:
        - name: homelab-dashboard
          image: ${DASHBOARD_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: OLLAMA_BACKEND_MODE
              value: "${OLLAMA_BACKEND_MODE}"
          volumeMounts:
            - name: dashboard-config
              mountPath: /app/config
            - name: docker-sock
              mountPath: /var/run/docker.sock
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: dashboard-config
          configMap:
            name: homelab-dashboard-config
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
---
apiVersion: v1
kind: Service
metadata:
  name: homelab-dashboard
  namespace: homelab
  labels:
    app: homelab-dashboard
spec:
  type: LoadBalancer
  selector:
    app: homelab-dashboard
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
