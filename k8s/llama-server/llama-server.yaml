apiVersion: v1
kind: Service
metadata:
  name: llama-server
  namespace: homelab
  labels:
    app: llama-server
spec:
  ports:
    - name: http
      port: 8001
      targetPort: 8001
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: llama-server
  namespace: homelab
  labels:
    app: llama-server
subsets:
  - addresses:
      - ip: ${LLAMA_SERVER_HOST_IP}
    ports:
      - name: http
        port: 8001
        protocol: TCP
