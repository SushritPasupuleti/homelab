apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: homelab
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      runtimeClassName: ${OLLAMA_RUNTIME_CLASS}
      containers:
        - name: ollama
          image: ${OLLAMA_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11434
              name: http
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0
            - name: OLLAMA_NUM_GPU
              value: "${OLLAMA_NUM_GPU}"
            - name: OLLAMA_BACKEND_MODE
              value: "${OLLAMA_BACKEND_MODE}"
            - name: NVIDIA_VISIBLE_DEVICES
              value: "${OLLAMA_NVIDIA_VISIBLE_DEVICES}"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "${OLLAMA_NVIDIA_DRIVER_CAPABILITIES}"
          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ${OLLAMA_GPU_REQUEST_KEY}
            limits:
              cpu: 4
              memory: 8Gi
              ${OLLAMA_GPU_LIMIT_KEY}
      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: ollama-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-data
  namespace: homelab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: homelab
  labels:
    app: ollama
spec:
  selector:
    app: ollama
  ports:
    - name: http
      port: 11434
      targetPort: 11434
      protocol: TCP
