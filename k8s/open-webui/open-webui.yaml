apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: homelab
  labels:
    app: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          image: ${OPEN_WEBUI_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: WEBUI_URL
              value: "http://open-webui.homelab.home.arpa"
            - name: OPENAI_API_BASE_URL
              value: "http://unsloth.homelab.svc.cluster.local:8000/v1"
            - name: OPENAI_API_KEY
              value: "${UNSLOTH_API_KEY}"
            - name: ENABLE_WEB_SEARCH
              value: "True"
            - name: WEB_SEARCH_ENGINE
              value: "openserp"
            - name: WEB_SEARCH_RESULT_COUNT
              value: "5"
            - name: OPENSERP_BASE_URL
              value: "http://openserp.homelab.svc.cluster.local:7000"
            - name: OPENSERP_API_BASE_URL
              value: "http://openserp.homelab.svc.cluster.local:7000"
            - name: WEBUI_AUTH
              value: "False"
          volumeMounts:
            - name: open-webui-data
              mountPath: /app/backend/data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
      volumes:
        - name: open-webui-data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: homelab
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: homelab
  labels:
    app: open-webui
spec:
  selector:
    app: open-webui
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
