apiVersion: apps/v1
kind: Deployment
metadata:
  name: openserp
  namespace: homelab
  labels:
    app: openserp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openserp
  template:
    metadata:
      labels:
        app: openserp
    spec:
      containers:
        - name: openserp
          image: ${OPENSERP_IMAGE}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              openserp serve -a 0.0.0.0 -p 7000
          ports:
            - containerPort: 7000
              name: http
          readinessProbe:
            httpGet:
              path: /health
              port: 7000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: 7000
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: openserp
  namespace: homelab
  labels:
    app: openserp
spec:
  selector:
    app: openserp
  ports:
    - name: http
      port: 7000
      targetPort: 7000
      protocol: TCP
